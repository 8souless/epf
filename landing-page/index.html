<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pro Fitness</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Montserrat', sans-serif; }
        body {
            background: radial-gradient(circle at center, #2a0508, #050505);
            color: #FFFFFF;
            overflow: hidden;
        }
        .hero {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .dust-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        #disc-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Step content - hidden by default */
        .step-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            text-align: center;
            padding: 2rem;
        }
        .step-content.hidden { display: none; text-decoration: line-through; }
        #word0, #word1, #eyebrow { font-size: 4rem; font-weight: 800; }
        #word1 { font-size: 6rem; font-weight: 900; }
        #eyebrow { font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.8; }
        .timeline { display: flex; justify-content: center; gap: 2rem; margin-top: 3rem; flex-wrap: wrap; }
        .card-wrapper { width: 200px; height: 260px; cursor: pointer; }
        .card-wrapper:hover img { transform: scale(1.05); transition: transform 0.3s; }
        .booking-form {
            background: rgba(255,255,255,0.1);
            padding: 2rem; border-radius: 10px;
            margin-top: 2rem; max-width: 400px; margin-left: auto; margin-right: auto;
        }
        .booking-form input, .booking-form select {
            width: 100%; padding: 0.8rem; margin: 0.5rem 0;
            background: white; border: none; border-radius: 5px;
        }
        .booking-form button {
            background: #E10600; color: white; border: none; padding: 1rem 2rem;
            cursor: pointer; border-radius: 5px; font-weight: 800;
        }
        .parallax-scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .parallax-layer { position: absolute; width: 100%; height: 100%; }
        .parallax-layer.land { z-index: 4; }
        .parallax-layer.fore { z-index: 6; }
        .northfield-text { position: absolute; bottom: 30%; width: 100%; font-size: 3rem; font-weight: 900; }
        #region { position: absolute; bottom: 10%; left: 2rem; }
        /* Mobile responsive at 390px width */
        @media (max-width: 390px) {
            #word0 { font-size: 2.5rem; }
            #word1 { font-size: 1.8rem; }
            header { font-size: 0.8rem; }
            nav a { padding: 4px 8px; }
            .rail-dot { width: 10px; height: 10px; }
            .cta-button { padding: 8px 16px; font-size: 0.8rem; }
            .booking-form { max-width: 90%; padding: 1rem; }
        }
    </style>
</head>
<body>
    <main class="hero" id="hero">
        <header>
            <div class="logo-wrapper">
                <img src="assets/logo-3d.webp" alt="Elite Pro Fitness" width="40" height="40">
                <span>ELITE PRO</span>
            </div>
            <nav>
                <a href="#" aria-label="Who we are">Who we are</a>
                <a href="#" aria-label="Classes">Classes</a>
                <a href="#" aria-label="Where we are">Where we are</a>
                <a href="#" aria-label="Contact">Contact</a>
            </nav>
            <div class="social">
                <a href="#" aria-label="Facebook">FB</a>
                <a href="#" aria-label="TikTok">TT</a>
            </div>
        </header>

        <!-- Disc container -->
        <div id="disc-container">
            <canvas class="dust-canvas" id="dust-canvas"></canvas>
        </div>

        <!-- Step 0: Initial landing -->
        <div id="step0" class="step-content">
            <div id="word0" style="display:block;">ELITE PRO</div>
        </div>

        <!-- Step 1: Training options -->
        <div id="step1" class="step-content hidden">
            <div id="word1">TRAIN</div>
            <div id="eyebrow">with us, grow with us</div>
            <div class="timeline">
                <div class="card-wrapper" data-tile="coach">
                    <img src="assets/coach.webp" alt="Who we are - Coach" loading="lazy">
                </div>
                <div class="card-wrapper" data-tile="corner">
                    <img src="assets/corner.webp" alt="Classes - Boxing Corner" loading="lazy">
                </div>
                <div class="card-wrapper" data-tile="outside">
                    <img src="assets/outside.webp" alt="Where we are - Training Location" loading="lazy">
                </div>
                <div class="card-wrapper" data-tile="coach-close">
                    <img src="assets/coach.webp" alt="Contact - Get in Touch" loading="lazy">
                </div>
            </div>
            <div class="booking-form">
                <input type="text" placeholder="Name" required>
                <input type="tel" placeholder="Phone" required>
                <select>
                    <option>Boxing Class</option>
                    <option>Kickboxing</option>
                    <option>MMA</option>
                </select>
                <button type="submit">Book Free Trial →</button>
                <p>Call 07968 043030 | <span id="hours">[hours]</span> | <span id="prices">[prices]</span></p>
            </div>
        </div>

        <!-- Step 2: Landing (parallax) -->
        <div id="step2" class="step-content hidden">
            <div class="parallax-scene">
                <div class="parallax-layer land" style="background:url('assets/outside.webp'); background-size:cover; opacity:0.8;"></div>
                <div class="parallax-layer fore" style="background:url('assets/fore.webp'); background-size:cover; opacity:0.6;"></div>
            </div>
            <div class="northfield-text" style="color:#FFFFFF;">NORTHFIELD</div>
            <div id="region" style="color:#FFFFFF;">
                <destName>NORTHFIELD</destName>
                <small style="opacity:0.8;">201A Merritts Brook Lane · Birmingham B31 1UH</small>
            </div>
            <button id="explore" style="margin-top:2rem;">Explore</button>
        </div>

        <div class="hint" id="hint">Touch or drag the disc</div>

        <div class="rail" id="rail">
            <button class="rail-dot on" data-step="0" aria-label="Step 0"></button>
            <button class="rail-dot" data-step="1" aria-label="Step 1"></button>
            <button class="rail-dot" data-step="2" aria-label="Step 2"></button>
        </div>
    </main>

    <script type="module">
        // Three.js r170 scene
        import * as THREE from 'three';

        const canvas = document.createElement('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const camera = new THREE.OrthographicCamera(
            -200000, 200000, 200000, -200000, -2e5, 2e5
        );
        camera.position.set(0, 0, 500000);

        const scene = new THREE.Scene();
        const planet = new THREE.Group();
        const tilt = new THREE.Group();
        const spin = new THREE.Group();
        planet.add(tilt);
        tilt.add(spin);
        scene.add(planet);

        // Load logo texture
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');

        const logoTexture = new THREE.Texture();
        loader.load('assets/logo-stacked.webp', (texture) => {
            logoTexture.image = texture.image;
            logoTexture.needsUpdate = true;
        }, undefined, (error) => {
            console.warn('Falling back to PNG:', error);
            loader.load('assets/logo-stacked.png', (t) => {
                logoTexture.image = t.image;
                logoTexture.needsUpdate = true;
            });
        });

        // Disc geometry
        const geometry = new THREE.SphereGeometry(1, 128, 96);

        // Rim lights: red #E10600 instead of crimson
        const fragmentShader = \`
            uniform vec3 uRimColor;
            uniform sampler2D uMap;
            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            void main() {
                vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
                float rim = 1.0 - max(0.0, dot(vNormal, viewDirection));
                rim = pow(rim, 2.0) * 0.5;
                vec4 discColor = texture2D(uMap, vUv);
                vec3 atmosphere = vec3(1.0) * rim * uRimColor;
                gl_FragColor = vec4(discColor.rgb + atmosphere, discColor.a);
            }
        \`;
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uRimColor: { value: new THREE.Color('#E10600') },
                uMap: { value: logoTexture }
            },
            vertexShader: \`
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying vec2 vUv;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            \`,
            fragmentShader: fragmentShader,
            transparent: true,
            side: THREE.DoubleSide
        });

        const disc = new THREE.Mesh(geometry, material);
        spin.add(disc);

        // Atmosphere sphere
        const atmosphereGeometry = new THREE.SphereGeometry(1.05, 128, 96);
        const atmosphereMaterial = new THREE.MeshBasicMaterial({
            color: new THREE.Color('#E10600'),
            transparent: true,
            opacity: 0.3,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        spin.add(new THREE.Mesh(atmosphereGeometry, atmosphereMaterial));

        document.getElementById('disc-container').appendChild(canvas);

        // State machine
        let st = 0; // State: 0..2
        let wheelLock = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragRotation = 0;

        // Navigation functions
        function go(n) {
            const target = Math.max(0, Math.min(2, n));
            if (target === st) return;
            st = target;
            updateRail();
            updateSteps();
        }

        function updateRail() {
            document.querySelectorAll('.rail-dot').forEach((dot, i) => {
                dot.classList.toggle('on', i === Math.floor(st));
            });
        }

        function updateSteps() {
            document.querySelectorAll('.step-content').forEach((el, i) => {
                el.classList.toggle('hidden', i !== Math.floor(st));
            });
            document.getElementById('word0').style.display = st === 0 ? 'block' : 'none';
        }

        // Step transitions
        function onWheel(e) {
            const now = Date.now();
            if (now - wheelLock < 1400) return;
            wheelLock = now;
            const target = e.deltaY > 0 ? Math.min(2, st + 1) : Math.max(0, st - 1);
            go(target);
        }

        function onKeyDown(e) {
            switch (e.key) {
                case 'ArrowUp': go(Math.max(0, st - 1)); break;
                case 'ArrowDown': go(Math.min(2, st + 1)); break;
                case ' ':
                case 'Enter':
                case 'Escape':
                    e.preventDefault();
                    go(st === 0 ? 2 : st - 1);
                    break;
            }
        }

        function onPointerDown(e) {
            isDragging = true;
            dragStartX = e.clientX;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const delta = (e.clientX - dragStartX) * 0.01;
            spin.rotation.y += delta;
            dragStartX = e.clientX;
        }

        function onPointerUp() {
            isDragging = false;
            dragRotation = spin.rotation.y;
        }

        // Event listeners
        window.addEventListener('wheel', onWheel, { passive: false });
        window.addEventListener('keydown', onKeyDown);
        canvas.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) spin.rotation.y += 0.001;

            // Dust canvas animation
            updateDust();

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.render(scene, camera);
        }
        animate();

        // Dust canvas effect
        function updateDust() {
            // Placeholder for dust particle animation
            // Will render dust motes: rgba(255,240,235,.95) → rgba(225,6,0,.35)
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // prefers-reduced-motion support
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            window.removeEventListener('wheel', onWheel);
            document.getElementById('hint').style.display = 'none';
        }
    </script>
</body>
</html>
